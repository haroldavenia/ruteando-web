# Entorno de DESARROLLO con Docker (ver README.md, «Con Docker»). No es el despliegue de producción (ese es next-ruteando/Dockerfile).
#
#   docker compose up                              -> http://localhost:3000 (next-ruteando compilado) contra el gateway simulado
#   docker compose --profile test run --rm test    -> pruebas de next-ruteando (Vitest)
#
# Por defecto la app habla con el gateway SIMULADO (mock-gateway, datos ficticios). Para usar otro gateway define
# DOCKER_GATEWAY_URL y DOCKER_GATEWAY_API_KEY (en .env o en el entorno). No se usan GATEWAY_URL/GATEWAY_API_KEY a propósito:
# así un .env con el gateway real no se aplica por accidente.
# `next dev` no hidrata detrás de proxy.ts (HMR por websocket), por eso aquí se compila y se sirve en producción.

x-dev: &dev
  build:
    context: .
    dockerfile: Dockerfile.dev
    target: dev
  working_dir: /app
  volumes:
    - .:/app
    # node_modules en volúmenes: los binarios de Windows/Mac no sirven en Linux y así es mucho más rápido
    - node_modules_root:/app/node_modules
    - node_modules_web:/app/next-ruteando/node_modules
    - next_cache:/app/next-ruteando/.next
    # Almacén de pnpm: los paquetes descargados sobreviven a recrear los contenedores
    - pnpm_store:/pnpm-store

x-gateway: &gateway
  GATEWAY_URL: ${DOCKER_GATEWAY_URL:-http://mock-gateway:4010}
  GATEWAY_API_KEY: ${DOCKER_GATEWAY_API_KEY:-mock}

# Segundo factor: los correos y los SMS de desarrollo llegan a Mailpit (http://localhost:8025), nada sale a internet.
# MFA_SECRET_KEY de aquí es SOLO de desarrollo (no es un secreto): en cualquier otro entorno se define una propia.
x-mfa: &mfa
  MFA_SECRET_KEY: ${MFA_SECRET_KEY:-cnV0ZWFuZG8tZGV2LWNsYXZlLXNvbG8tcHJ1ZWJhISE=}
  MFA_DB_PATH: /data/mfa.sqlite
  SSO_DB_PATH: /data/sso.sqlite
  SMTP_HOST: mailpit
  SMTP_PORT: '1025'
  # `dev` por defecto (el SMS llega a Mailpit); con SMS_PROVIDER=twilio en el .env se usa Twilio Verify de verdad
  SMS_PROVIDER: ${SMS_PROVIDER:-dev}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}

services:
  # Bandeja de correo de desarrollo: SMTP en 1025 e interfaz web en :8025
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - '8025:8025'
      # SMTP también hacia el equipo: así `pnpm start` fuera de Docker usa SMTP_HOST=127.0.0.1
      - '1025:1025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

  # Instala las dependencias (un solo pnpm-lock.yaml) solo cuando cambia ese fichero
  deps:
    <<: *dev
    command:
      - sh
      - -c
      - |
        set -e
        hash=$$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
        if [ "$$(cat node_modules/.lock-hash 2>/dev/null)" != "$$hash" ]; then
          echo "pnpm install"
          pnpm install --frozen-lockfile
          echo "$$hash" > node_modules/.lock-hash
        fi
    restart: 'no'

  mock-gateway:
    <<: *dev
    command: node scripts/mock-gateway.mjs
    ports:
      - '4010:4010'
    healthcheck:
      # Cualquier respuesta HTTP (aunque sea 404) significa que está vivo
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4010/').then(() => process.exit(0), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *dev
    command: sh -c "pnpm --filter next-ruteando run build && pnpm --filter next-ruteando run start -p 3000"
    environment:
      <<: [*gateway, *mfa]
      SESSION_SECRET: ${SESSION_SECRET:-desarrollo-local-0123456789-abcdefghijklmnop}
      COOKIE_SECURE: 'false'
      ALLOW_LOGIN_WITHOUT_MFA: 'true'
      CSP_MODE: ${CSP_MODE:-report-only}
    volumes:
      - .:/app
      - node_modules_root:/app/node_modules
      - node_modules_web:/app/next-ruteando/node_modules
      - next_cache:/app/next-ruteando/.next
      - pnpm_store:/pnpm-store
      - mfa_data:/data
    ports:
      - '3000:3000'
    depends_on:
      deps:
        condition: service_completed_successfully
      mock-gateway:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  test:
    <<: *dev
    profiles: ['test']
    command: pnpm --filter next-ruteando run test
    depends_on:
      deps:
        condition: service_completed_successfully

volumes:
  mfa_data:
  node_modules_root:
  node_modules_web:
  next_cache:
  pnpm_store:
