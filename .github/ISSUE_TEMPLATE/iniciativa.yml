name: Iniciativa
description: Agrupa fases e historias; se enlaza a specs/<iniciativa>/README.md
title: "Iniciativa: <nombre>"
labels: ["tipo:iniciativa"]
body:
  - type: input
    id: readme
    attributes:
      label: README de la iniciativa
      placeholder: specs/<iniciativa>/README.md
    validations:
      required: true
  - type: textarea
    id: objetivo
    attributes:
      label: Objetivo medible y fuera de alcance
    validations:
      required: true
