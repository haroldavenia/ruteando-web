name: CI

# Verifica cada cambio antes de llegar a main: calidad, pruebas y compilación del BFF en Next.js (next-ruteando, con su imagen
# de producción), validación estricta de las specs y auditoría de las dependencias de producción. La comprobación obligatoria de main es `ci`.
on:
  # Sin filtro de ramas: los pull requests están apilados y su base no siempre es main
  pull_request:
  push:
    branches: [main]

# Una ejecución nueva sobre la misma rama cancela la anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Misma versión del CLI de specs que se usa en local; se actualiza a mano junto con ella
  OPENSPEC_VERSION: 1.14.3

# El ejecutor está fijado a ubuntu-24.04 (no `ubuntu-latest`, que migra a Ubuntu 26): se cambia a propósito, no por sorpresa
# pnpm: la acción pnpm/action-setup toma la versión del campo `packageManager` de package.json (no se repite aquí).
# Va después de checkout y antes de setup-node, que necesita pnpm para su caché.
jobs:
  next:
    name: Next.js BFF (calidad, pruebas e imagen)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile
      # next-ruteando tiene su propio ESLint y su propio Prettier (con los plugins de Tailwind): la raíz los ignora
      - name: Lint
        run: pnpm --filter next-ruteando run lint
      - name: Formato
        run: pnpm --filter next-ruteando run format
      - name: Tipos
        run: pnpm --filter next-ruteando run typecheck
      # Falla por debajo del 80 % de sentencias, ramas, funciones y líneas (vitest.config.mts)
      - name: Pruebas con cobertura
        run: pnpm --filter next-ruteando run test:coverage
      - name: Compilación de producción
        run: pnpm --filter next-ruteando run build
      # La imagen se construye de verdad: lo que compila aquí puede fallar dentro del contenedor (contexto: la raíz, por el lockfile único)
      - name: Imagen de producción
        run: docker build -f next-ruteando/Dockerfile -t ruteando-next:ci .

  specs:
    name: Specs (validación estricta)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Herramienta externa, no una dependencia del proyecto: se ejecuta con el npx que ya trae Node
      - name: Validar las specs
        run: npx --yes "@fission-ai/openspec@${OPENSPEC_VERSION}" validate --specs --strict

  audit:
    name: Auditoría (dependencias de producción)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Solo producción y solo altas o críticas: las de desarrollo no llegan al producto. No instala nada: lee el lockfile
      - name: Auditar las dependencias
        run: pnpm audit --prod --audit-level=high

  # Comprobación única que exige la protección de main: solo está en verde si todas las demás lo están
  ci:
    name: ci
    if: always()
    needs: [next, specs, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Resumen
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Resultados: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Alguna comprobación no terminó en éxito (fallo, cancelada u omitida)"
              exit 1
            fi
          done
