version: 2

# Revisión semanal de dependencias. Los pull requests de Dependabot pasan por el mismo CI.
# El ecosistema `npm` también cubre pnpm: con un workspace (pnpm-workspace.yaml) basta UNA entrada en la raíz;
# actualiza next-ruteando sobre el único pnpm-lock.yaml (una entrada por carpeta duplicaba los pull requests).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Los tipos de Node siguen al mínimo que se soporta (`engines`: 22), no a la última versión de Node
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # ESLint 10 y `@eslint/js` 10 se suben juntos y a mano: los plugins de next-ruteando aún no lo admiten
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: '@eslint/js'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
