version: 2

# Revisión semanal de dependencias. Los pull requests de Dependabot pasan por el mismo CI.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ng-ruteando
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      # Los paquetes de Angular se actualizan juntos para no mezclar versiones
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      menores-y-parches:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
