<mat-toolbar color="primary">
  @if (!isWide()) {
    <button mat-icon-button type="button" aria-label="Abrir menú de navegación" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span class="title">Ruteando</span>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #drawer [mode]="mode()" [opened]="isWide()" role="navigation" aria-label="Navegación principal">
    <mat-nav-list>
      @for (item of items; track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="!isWide() && drawer.close()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
