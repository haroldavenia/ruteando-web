<mat-toolbar color="primary">
  @if (!isWide()) {
    <button mat-icon-button type="button" aria-label="Abrir menú de navegación" (click)="drawer.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
  }
  <span class="title">Ruteando</span>
  <span class="spacer"></span>
  <button mat-icon-button type="button" aria-label="Menú de usuario" [matMenuTriggerFor]="userMenu">
    <mat-icon aria-hidden="true">account_circle</mat-icon>
  </button>
  <mat-menu #userMenu="matMenu">
    <div class="user-info" role="group" aria-label="Sesión iniciada">
      <span class="user-name">{{ displayName() }}</span>
      <span class="user-email">{{ email() }}</span>
    </div>
    <button mat-menu-item type="button" (click)="confirmLogout()">
      <mat-icon aria-hidden="true">logout</mat-icon>
      <span>Cerrar sesión</span>
    </button>
  </mat-menu>
</mat-toolbar>

<mat-sidenav-container class="container">
  <mat-sidenav #drawer [mode]="mode()" [opened]="isWide()" role="navigation" aria-label="Navegación principal">
    <mat-nav-list>
      @for (item of items; track item.link) {
        <a
          mat-list-item
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="!isWide() && drawer.close()"
        >
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="content">
    <router-outlet />
  </mat-sidenav-content>
</mat-sidenav-container>
