<div class="toolbar" role="group" aria-label="Herramientas del polígono">
  @if (!drawing()) {
    <button mat-stroked-button type="button" (click)="startDrawing()" [disabled]="!olMap()">
      <mat-icon aria-hidden="true">draw</mat-icon>Dibujar polígono
    </button>
    <button mat-button type="button" (click)="clear()" [disabled]="vertices().length === 0">Borrar polígono</button>
  } @else {
    <button mat-flat-button type="button" (click)="finishDrawing()">Terminar polígono</button>
    <button mat-button type="button" (click)="cancelDrawing()">Cancelar</button>
    <span class="hint" role="status">Haz clic en el mapa para añadir vértices; doble clic o «Terminar polígono» para cerrarlo. Escape cancela.</span>
  }
</div>

<div
  #host
  class="map"
  role="region"
  aria-label="Mapa para dibujar el polígono. También puedes escribir los vértices en la tabla de más abajo."
></div>
@if (failed()) {
  <p class="notice error" role="alert">No se pudo cargar el mapa. Puedes seguir escribiendo los vértices en la tabla.</p>
}

<div class="side">
  <p class="summary" [class.problem]="!valid() && vertices().length > 0" role="status" aria-live="polite">{{ summary() }}</p>

  <app-vertex-table [(vertices)]="vertices" />
</div>
