<div class="toolbar" role="group" [attr.aria-label]="'Herramientas del polígono' | t">
  @if (!drawing()) {
    <button mat-stroked-button type="button" (click)="startDrawing()" [disabled]="!olMap()">
      <mat-icon aria-hidden="true">draw</mat-icon>{{ 'Dibujar polígono' | t }}
    </button>
    <button mat-button type="button" (click)="clear()" [disabled]="vertices().length === 0">
      {{ 'Borrar polígono' | t }}
    </button>
  } @else {
    <button mat-flat-button type="button" (click)="finishDrawing()">{{ 'Terminar polígono' | t }}</button>
    <button mat-button type="button" (click)="cancelDrawing()">{{ 'Cancelar' | t }}</button>
    <span class="hint" role="status">{{
      'Haz clic en el mapa para añadir vértices; doble clic o «Terminar polígono» para cerrarlo. Escape cancela.' | t
    }}</span>
  }
</div>

<div
  #host
  class="map"
  role="region"
  [attr.aria-label]="
    'Mapa para dibujar el polígono. También puedes escribir los vértices en la tabla de más abajo.' | t
  "
></div>
@if (failed()) {
  <p class="notice error" role="alert">
    {{ 'No se pudo cargar el mapa. Puedes seguir escribiendo los vértices en la tabla.' | t }}
  </p>
}

<div class="side">
  <p class="summary" [class.problem]="!valid() && vertices().length > 0" role="status" aria-live="polite">
    {{ summary() }}
  </p>

  <app-vertex-table [(vertices)]="vertices" />
</div>
