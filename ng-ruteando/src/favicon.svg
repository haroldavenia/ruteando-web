<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Favicon de Ruteando: el emblema de la marca (shared/brand/brand.component.ts) en blanco sobre el degradado de la marca.
       Trazos más gruesos que en la marca para que se lean a 16 px. Se regenera favicon.ico con scripts/generate-favicon.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3fc0"/>
      <stop offset="1" stop-color="#b8326f"/>
    </linearGradient>
    <g id="arrow">
      <path d="M24 11 A13 13 0 0 1 35.26 17.5" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/>
      <path d="M37.4 21 L32.3 19.2 L38.4 15.6 Z" fill="#fff" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <g transform="translate(5.5 5) scale(1.1)">
    <rect x="19.5" y="1" width="9" height="5" rx="1.8" fill="#fff"/>
    <rect x="35.5" y="5.6" width="7" height="3.8" rx="1.4" transform="rotate(40 39 7.5)" fill="#fff"/>
    <circle cx="24" cy="26" r="19" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-width="4.2"/>
    <g transform="translate(0 2)">
      <use href="#arrow"/>
      <use href="#arrow" transform="rotate(120 24 24)"/>
      <use href="#arrow" transform="rotate(240 24 24)"/>
    </g>
  </g>
</svg>
